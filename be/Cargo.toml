[package]
name = "be"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
http-body-util = "0.1.5"
rust_decimal = { version = "1.43.0", features = ["serde-float", "serde-arbitrary-precision", "db-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "migrate", "uuid", "chrono", "rust_decimal", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
futures = "0.3.34"
rust_decimal_macros = "1.40.0"
