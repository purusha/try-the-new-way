# Postgres per lo sviluppo locale (spec 007). Credenziali di solo sviluppo.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
